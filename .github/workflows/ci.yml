# T-15 — ruff check + pytest(백엔드) + tsc --noEmit + next build(프론트).
# (ARCHITECTURE.md §5 "CI: GitHub Actions — ruff check + pytest + 프론트 tsc --noEmit/next build")
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: reviewdb
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d reviewdb"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # CI 전용 더미 값. DB는 로컬 서비스 컨테이너, LLM/카카오/웹푸시는 실제로 호출하지 않는다
      # (테스트는 전부 mock — CLAUDE.md 규칙 위반 아님).
      DATABASE_URL: postgresql+asyncpg://app:app@localhost:5432/reviewdb
      SUPABASE_JWT_SECRET: ci-jwt-secret
      GEMINI_API_KEY: ci-dummy-key
      INTERNAL_API_KEY: ci-internal-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend deps
        working-directory: backend
        run: pip install -e ".[dev]"

      # 빈 DB에 마이그레이션 적용 — 000은 로컬/CI 전용 auth 스텁(Supabase엔 적용 안 함, 파일 안 주석 참고).
      # docker-compose.dev.yml의 initdb 훅과 동일하게 파일명 순서(000→001→…→004)대로 적용.
      # DATABASE_URL 은 SQLAlchemy 표기(postgresql+asyncpg://)라 psql 이 URL 로 인식하지 못한다
      # (DB 이름으로 해석해 로컬 소켓 접속을 시도하다 실패 — 이 단계가 계속 빨갛던 원인).
      # psql 에는 드라이버 표기를 뺀 표준 스킴으로 넘긴다. (worker.backup_database 의 pg_dump 와 같은 처리)
      - name: Apply migrations
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          PSQL_URL="${DATABASE_URL/+asyncpg/}"
          for f in $(ls backend/migrations/*.sql | sort); do
            echo "applying $f"
            psql "$PSQL_URL" -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: ruff check
        working-directory: backend
        run: ruff check .

      - name: pytest
        working-directory: backend
        run: pytest

      # 프론트 타입 생성용 — DB 접속 없이 FastAPI 라우트/Pydantic 스키마만 읽는다(앱 기동 불필요).
      - name: Export OpenAPI schema
        working-directory: backend
        run: |
          python -c "
          import json
          from app.main import app
          json.dump(app.openapi(), open('openapi.json', 'w'), ensure_ascii=False)
          "

      - uses: actions/upload-artifact@v4
        with:
          name: openapi-schema
          path: backend/openapi.json
          retention-days: 1

  frontend:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: openapi-schema
          path: frontend

      # 손으로 안 쓰고 백엔드 job이 만든 openapi.json에서 생성 (ARCHITECTURE.md 결정 10,
      # CLAUDE.md "API 타입은 openapi-typescript — 손으로 API 타입 정의 금지").
      - name: Generate API types
        working-directory: frontend
        run: npx openapi-typescript openapi.json -o src/lib/api-types.d.ts

      - name: Type-check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8010/api/v1
        run: npm run build
